name: Taxi 40100 portal test
on:
  push:
    branches: [test/40100-portal-access]
    paths: [.github/workflows/taxi40100-probe.yml]
permissions: {}
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check whether both portal secrets are configured
        env:
          LOGIN_READY: ${{ secrets.TAXI40100_USERNAME != '' && secrets.TAXI40100_PASSWORD != '' }}
        run: |
          if [ "$LOGIN_READY" != true ]; then
            echo "Both portal secrets are required."
            exit 1
          fi
      - name: Check official login page
        shell: bash
        run: |
          set -euo pipefail
          url='https://service.taxi4me.net/4010/unternehmer2.4/?sprache=de'
          curl -sSL --max-time 30 -o /dev/null -w 'HTTP %{http_code}, bytes %{size_download}\n' "$url"
          google-chrome --headless --disable-gpu --virtual-time-budget=12000 --dump-dom "$url" > "$RUNNER_TEMP/portal.html"
          if ! grep -Eqi '<input[^>]*type="password"' "$RUNNER_TEMP/portal.html"; then
            echo 'Login form missing. Page title:'
            grep -Eio '<title>[^<]{0,150}' "$RUNNER_TEMP/portal.html" || true
            exit 1
          fi
          echo 'Rendered portal login form reached.'
